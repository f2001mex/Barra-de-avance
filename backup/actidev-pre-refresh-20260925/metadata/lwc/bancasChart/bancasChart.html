<template><section class="chart"><h3>{title}</h3><template lwc:if={isBar}><template for:each={normalized} for:item="item"><div key={item.label} class="row"><span title={item.label}>{item.label}</span><div class="track"><div class="bar" style={item.style}></div></div><strong>{item.displayValue}</strong></div></template></template><template lwc:if={isColumn}><div class="columns"><template for:each={normalized} for:item="item"><div key={item.label} class="column-item"><strong>{item.displayValue}</strong><div class="column-track"><div class="column-bar" style={item.columnStyle}></div></div><span title={item.label}>{item.label}</span></div></template></div></template><template lwc:if={isFunnel}><div class="funnel"><template for:each={normalized} for:item="item"><div key={item.label} class="funnel-row" style={item.funnelStyle}><span>{item.label}</span><strong>{item.displayValue}</strong></div></template></div></template><template lwc:if={isDonut}><div class="donut-layout"><div class="donut" style={donutStyle}><div class="donut-hole">Total</div></div><div class="legend"><template for:each={normalized} for:item="item"><div key={item.label}><i style={item.style}></i><span>{item.label}</span><strong>{item.displayValue}</strong></div></template></div></div></template><template lwc:if={empty}><p>No hay datos para los filtros seleccionados.</p></template><template lwc:if={reportId}><button class="report-link" onclick={openReport}>Ver reporte completo →</button></template></section></template>
