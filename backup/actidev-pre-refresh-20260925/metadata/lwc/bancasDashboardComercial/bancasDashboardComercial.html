<template>
    <header class="dashboard-header"><h2>Dashboard Comercial Ejecutivo</h2><p>Visión general del pipeline, cartera y oportunidades comerciales para seguimiento ejecutivo y toma de decisiones.</p></header>
    <div class="kpis"><c-bancas-kpi-card label="Pipeline total" value={pipeline} icon="utility:money" tone="blue"></c-bancas-kpi-card><c-bancas-kpi-card label="Oportunidades abiertas" value={data.openOpportunities} icon="utility:chart" tone="green"></c-bancas-kpi-card><c-bancas-kpi-card label="Monto promedio por oportunidad" value={average} icon="utility:user" tone="orange"></c-bancas-kpi-card><c-bancas-kpi-card label="Oportunidades próximas a cierre (30 días)" value={rows.length} icon="utility:event" tone="purple"></c-bancas-kpi-card><c-bancas-kpi-card label="Monto próximo a cierre (30 días)" value={upcomingAmount} icon="utility:money" tone="purple"></c-bancas-kpi-card></div>
    <div class="grid three"><c-bancas-chart title="Pipeline de oportunidades por etapa" items={stageItems} report-id={stageReport} variant="funnel"></c-bancas-chart><c-bancas-chart title="Monto total por producto" items={productItems} report-id={productReport} variant="bar"></c-bancas-chart><c-bancas-chart title="Tipo de Cliente" items={data.clientsBySegment} report-id={institutionalReport} variant="donut"></c-bancas-chart></div>
    <div class="grid tables"><section class="panel"><h3>Oportunidades próximas a cierre (próximos 30 días)</h3><lightning-datatable key-field="id" data={rows} columns={columns} hide-checkbox-column></lightning-datatable><button onclick={openClosing}>Ver reporte completo →</button></section><section class="panel"><h3>Oportunidades por producto — Top 5</h3><lightning-datatable key-field="label" data={topProducts} columns={productColumns} hide-checkbox-column></lightning-datatable><button onclick={openProduct}>Ver reporte completo →</button></section></div>
</template>
