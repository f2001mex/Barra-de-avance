<template><article class={cardClass}><div class="summary"><div class={iconClass}><lightning-icon icon-name={icon} size="small" variant="inverse"></lightning-icon></div><div class="content"><span>{label}</span><strong title={value}>{value}</strong></div></div><template lwc:if={isLine}><div class="sparkline"><svg viewBox="0 0 240 58" preserve-aspect-ratio="none" role="img" aria-label={label}><polyline points={linePoints}></polyline></svg><div class="axis"><template for:each={trend} for:item="item"><small key={item.label}>{item.label}</small></template></div></div></template><template lwc:if={isDonut}><div class="task-chart"><div class="mini-donut" style={donutStyle}></div><div class="mini-legend"><template for:each={donutItems} for:item="item"><div key={item.label}><i style={item.legendStyle}></i><span>{item.label}</span><b>{item.value}</b></div></template></div></div></template></article></template>
