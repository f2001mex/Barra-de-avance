<template>
	<lightning-card
		title="Portafolio del Contrato"
		icon-name="standard:contract"
	>
		<div
			if:true={errorMessage}
			class="slds-text-heading_medium slds-text-color_error slds-align_absolute-center slds-m-around_xx-large"
		>
			{errorMessage}
		</div>
		<lightning-accordion
			allow-multiple-sections-open
			active-section-name={activeSections}
			class="accordion-label"
		>
			<template
				if:true={orderedMarketDataElements}
				for:each={orderedMarketDataElements}
				for:item="section"
			>
				<lightning-accordion-section
					name={section.section}
					label={section.sectionLabel}
					key={section.section}
				>
					<lightning-accordion
						allow-multiple-sections-open
						active-section-name={activeSubsections}
						class="nestedAccordion-label"
					>
						<template
							if:true={section.sectionRecords}
							for:each={section.sectionRecords}
							for:item="subsection"
						>
							<lightning-accordion-section
								name={subsection.subsection}
								label={subsection.subsectionLabel}
								key={subsection.subsection}
							>
								<div
									style="
										width: 95%;
										border-top: 2px solid #bbb;
										margin-left: 24px;
									"
									class="slds-var-m-bottom_large"
								></div>
								<lightning-layout
									multiple-rows
									horizontal-align="center"
								>
									<lightning-layout-item size="11">
										<div
											class="market-table"
											if:true={subsection.tableMaxHeight}
										>
											<!-- sldsValidatorIgnoreNextLine -->
											<lightning-datatable
												class="slds-table_striped"
												columns={columns}
												data={subsection.values}
												key-field="Issuer"
												hide-checkbox-column
											>
											</lightning-datatable>
										</div>
										<div
											if:false={subsection.tableMaxHeight}
										>
											<!-- sldsValidatorIgnoreNextLine -->
											<lightning-datatable
												class="slds-table_striped"
												columns={columns}
												data={subsection.values}
												key-field="Issuer"
												hide-checkbox-column
											>
											</lightning-datatable>
										</div>
									</lightning-layout-item>
								</lightning-layout>
							</lightning-accordion-section>
						</template>
					</lightning-accordion>
				</lightning-accordion-section>
			</template>
			<lightning-accordion
				allow-multiple-sections-open
				active-section-name="cash"
				class="nestedAccordion-label"
			>
				<lightning-accordion-section
					name="cash"
					label={cashLabel}
					if:true={cashData}
				>
					<div
						style="
							width: 95%;
							border-top: 2px solid #bbb;
							margin-left: 24px;
						"
						class="slds-var-m-bottom_large"
					></div>
					<lightning-layout multiple-rows horizontal-align="center">
						<lightning-layout-item size="11">
							<div class="market-table" if:true={cashMaxHeight}>
								<!-- sldsValidatorIgnoreNextLine -->
								<lightning-datatable
									class="slds-table_striped"
									columns={columns}
									data={cashData}
									key-field="Issuer"
									hide-checkbox-column
								>
								</lightning-datatable>
							</div>
							<div if:false={cashMaxHeight}>
								<!-- sldsValidatorIgnoreNextLine -->
								<lightning-datatable
									class="slds-table_striped"
									columns={columns}
									data={cashData}
									key-field="Issuer"
									hide-checkbox-column
								>
								</lightning-datatable>
							</div>
						</lightning-layout-item>
					</lightning-layout>
				</lightning-accordion-section>
			</lightning-accordion>
		</lightning-accordion>
	</lightning-card>
</template>
